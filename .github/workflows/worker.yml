# Optional: deploys the worker to Cloudflare when worker/ changes.
# Needs two repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
# Without them this does nothing. SIGNING_KEY and GITHUB_TOKEN stay in Cloudflare (set once).
name: Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Nothing to do without Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy the worker from GitHub."
      - uses: cloudflare/wrangler-action@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
