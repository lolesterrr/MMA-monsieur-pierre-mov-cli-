name: diag
on:
  push:
    branches: [diag]
    paths: ["tools/diag.mjs", ".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tools/diag.mjs
      - run: |
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add -f diag-out.json; git commit -m "diag results"; git push
