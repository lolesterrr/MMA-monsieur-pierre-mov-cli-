name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/live_browser.py
      - if: always()
        run: |
          git config user.name diag-bot; git config user.email diag@users.noreply.github.com
          git add -f diag-browser.json; git commit -m "diag results"; git push
