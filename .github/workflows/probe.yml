name: Probe
on:
  workflow_dispatch:
    inputs:
      movie: { description: Movie to search for, default: the dark knight }
      tv: { description: Series to search for, default: breaking bad }
      base: { description: Site, default: "https://flixhq.to" }
  push:
    paths: [tools/probe.mjs, tools/matrix.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Sources matrix
        run: |
          git clone -q --depth 1 https://github.com/loak7993-code/streamviva-providers svp
          (cd svp && npm install --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null 2>&1 || npm install --ignore-scripts --no-audit --no-fund >/dev/null)
          node tools/matrix.mjs "$PWD/svp" 2>&1 | tee probe-log.txt
      - name: Push the findings to the probe branch
        if: always()
        run: |
          mv probe-log.txt probe-out/ || true
          cd probe-out
          git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@localhost commit -qm "probe $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
