name: Probe
on:
  workflow_dispatch:
    inputs:
      movie: { description: Movie to search for, default: the dark knight }
      tv: { description: Series to search for, default: breaking bad }
      script: { description: Which probe, default: probe3 }
  push:
    paths: [tools/probe3.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Sources matrix
        run: |
          node tools/${{ inputs.script || 'probe3' }}.mjs 2>&1 | tee probe-log.txt
      - name: Push the findings to the probe branch
        if: always()
        run: |
          mv probe-log.txt probe-out/ || true
          cd probe-out
          git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@localhost commit -qm "probe $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
