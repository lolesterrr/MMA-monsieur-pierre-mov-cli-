# Temporary: runs the worker code against the real sources while MMA is being built.
name: Probe
on:
  push:
    paths: [tools/live-check.mjs, worker/core.js, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: mkdir -p probe-out && LIVE_OUT=probe-out/live.txt node tools/live-check.mjs 2>&1 | tee probe-out/log.txt
      - name: Push the findings to the probe branch
        if: always()
        run: |
          cd probe-out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@localhost commit -qm "probe $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
