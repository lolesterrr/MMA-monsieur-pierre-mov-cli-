name: IP lock probe
on:
  push:
    paths: [tools/iplock.mjs, .github/workflows/iplock.yml]
permissions:
  contents: write
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node tools/iplock.mjs get
      - uses: actions/upload-artifact@v4
        with: { name: links, path: probe-out/links.json }
  b:
    needs: a
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: links, path: probe-out }
      - run: node tools/iplock.mjs try 2>&1 | tee probe-out/log.txt
        shell: bash
      - name: Push findings
        if: always()
        shell: bash
        run: |
          cd probe-out && git init -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@localhost commit -qm "iplock $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
